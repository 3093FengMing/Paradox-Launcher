[package]
name = "paradox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application domain and QuintElement adapter for Paradox Launcher"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
elemental.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
quick-xml.workspace = true
futures-util.workspace = true
hex.workspace = true
sha1.workspace = true
sha2.workspace = true
zip.workspace = true
uuid.workspace = true
base64 = "0.23.1"
# The persisted UI-suite protocol shares Unicode 15.1 normalization with the frontend.
unicode-normalization = "=0.1.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
