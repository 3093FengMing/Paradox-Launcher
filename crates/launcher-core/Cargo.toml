[package]
name = "paradox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application domain and QuintElement adapter for Paradox Launcher"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
elemental.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
futures-util.workspace = true
sha1.workspace = true
sha2.workspace = true
zip.workspace = true
uuid.workspace = true
base64 = "0.22"
unicode-normalization = "=0.1.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
