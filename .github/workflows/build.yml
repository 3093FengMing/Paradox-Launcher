name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: npm --prefix ui ci
      - name: Build release executable
        if: runner.os != 'macOS'
        run: npm run build -- --ci --no-bundle --target=${{ matrix.target }} -- --locked
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: >-
          npm run build -- --ci --no-sign --bundles app
          --config '{"bundle":{"icon":["icons/icon.icns"]}}'
          --target=${{ matrix.target }} -- --locked
      - name: Prepare downloadable artifact
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/launcher-artifacts
        run: node scripts/package-build-artifact.mjs ${{ matrix.platform }} "${{ env.ARTIFACT_DIRECTORY }}"
      - name: Upload compiled application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Paradox-Launcher-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/launcher-artifacts/
          if-no-files-found: error
          retention-days: 14
