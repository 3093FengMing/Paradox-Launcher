[workspace]
members = ["crates/launcher-core", "apps/desktop"]
default-members = ["apps/desktop"]
resolver = "3"
exclude = ["vendor/minecraft-msa-auth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6.0"
elemental = { package = "elemental-kit", git = "https://github.com/ElectronicWave/Elemental", rev = "26673f4878882eeb94d4341bdc3dae910d3e57b7", default-features = false, features = ["launcher", "driver", "core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.9", features = [] }
tauri-build = { version = "2.5", features = [] }
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

# Elemental passes oauth2's reqwest 0.12 Client to minecraft-msa-auth.
# Keep the helper on the same Client type until upstream fixes this boundary.
[patch.crates-io]
minecraft-msa-auth = { path = "vendor/minecraft-msa-auth" }
