[workspace]
members = ["crates/launcher-core", "apps/desktop"]
default-members = ["apps/desktop"]
resolver = "3"
exclude = ["vendor/QuintElement"]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
dirs = "6.0"
# Compile the tracked SDK submodule directly for launcher/core development.
elemental = { package = "elemental-kit", path = "vendor/QuintElement/crates/elemental", default-features = false, features = ["launcher", "driver", "core", "infra"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "form", "native-tls", "charset", "http2", "system-proxy"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2.9", features = [] }
tauri-build = { version = "2.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
