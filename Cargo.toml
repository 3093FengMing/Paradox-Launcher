[workspace]
members = ["crates/launcher-core", "apps/desktop"]
default-members = ["apps/desktop"]
resolver = "3"
exclude = ["vendor/QuintElement"]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
dirs = "7.0.0"
# Compile the tracked SDK submodule directly for launcher/core development.
elemental = { package = "elemental-kit", path = "vendor/QuintElement/crates/elemental", default-features = false, features = ["launcher", "driver", "core", "infra"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "query", "form", "native-tls", "charset", "http2", "system-proxy"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
futures-util = "0.3.34"
hex = "0.4.3"
sha1 = "0.11.0"
sha2 = "0.11.1"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
uuid = { version = "1.29.1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
